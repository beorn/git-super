name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  process-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ["1.3.14", "1.4.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: ./.github/actions/source-siblings
      - name: Git-super library and Bun CLI process contracts
        env:
          VITEST_MAX_WORKERS: "2"
        run: >-
          bun --bun x vitest run
          tests/library-runtime.test.ts
          tests/exclusive.test.ts
          tests/process.test.ts
          tests/pull-apply-signals.test.ts
  node-sibling-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/source-siblings
      - name: Node loads the pinned built sibling and acquires its native flock
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import { createHash } from "node:crypto"
          import { mkdtempSync, readFileSync, readdirSync, realpathSync, rmSync } from "node:fs"
          import { tmpdir } from "node:os"
          import { dirname, join } from "node:path"
          import { fileURLToPath } from "node:url"

          assert.match(process.version, /^v24\./)
          const config = JSON.parse(readFileSync("source-siblings.json", "utf8"))
          const index = config.siblings.findIndex((sibling) => sibling.name === "@bearly/flock")
          assert.ok(index >= 0, "flock source sibling is missing")
          const sibling = config.siblings[index]
          assert.equal(sibling.pack, true)
          const resolved = fileURLToPath(import.meta.resolve(sibling.name))
          assert.match(resolved, /node_modules\/@bearly\/flock\/dist\/index\.mjs$/)
          assert.match(realpathSync(resolved), /node_modules/)
          const holders = fileURLToPath(import.meta.resolve(`${sibling.name}/holders`))
          assert.match(holders, /node_modules\/@bearly\/flock\/dist\/holders\.mjs$/)
          await import(`${sibling.name}/holders`)
          const pkg = JSON.parse(readFileSync(join(dirname(resolved), "../package.json"), "utf8"))
          const packDir = `.ci-siblings/${index}-packed`
          const artifacts = readdirSync(packDir).filter((name) => name.endsWith(".tgz"))
          assert.equal(artifacts.length, 1)
          const sha256 = createHash("sha256").update(readFileSync(join(packDir, artifacts[0]))).digest("hex")
          const flock = await import(sibling.name)
          const scratch = mkdtempSync(join(tmpdir(), "git-super-node-sibling-"))
          try {
            const lock = join(scratch, "owner.lock")
            const handle = flock.acquireFlockBlocking(lock, { body: "node-sibling-ci" })
            try {
              assert.equal(flock.tryAcquireFlock(lock), null)
            } finally {
              handle.release()
            }
            assert.equal(flock.isFlockHeld(lock), false)
            const again = flock.tryAcquireFlock(lock)
            assert.ok(again)
            again.release()
          } finally {
            rmSync(scratch, { recursive: true, force: true })
          }
          console.log(JSON.stringify({ package: sibling.name, commit: sibling.commit, version: pkg.version, sha256, node: process.version, resolved, nativeFlock: "PASS" }))
          NODE

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/source-siblings
      - run: bun run check
      # Keep the Linux production descriptor-owner cases pinned separately
      # from the historic conformance corpus.
      - uses: actions/checkout@v4
        with:
          repository: beorn/yrd
          ref: 313e8df637e68f4d6f14214d3fff6dfe4082e5fe
          path: .yrd-process-contract
      - run: bun install --frozen-lockfile
        working-directory: .yrd-process-contract
      - name: Yrd production process settlement
        id: yrd-process
        working-directory: .yrd-process-contract
        run: >-
          bun --bun x vitest run
          packages/yrd-process/tests/process.test.ts
          packages/yrd-process/tests/process-tree.test.ts
          packages/yrd-process/tests/process-escaped-descendant.test.ts
          --reporter=default --reporter=json
          --outputFile=${{ github.workspace }}/yrd-process-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.yrd-process.outcome == 'success' || steps.yrd-process.outcome == 'failure') }}
        with:
          name: yrd-process-${{ matrix.os }}-${{ github.sha }}
          path: yrd-process-results.json
          if-no-files-found: error

  yrd-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/source-siblings
      # Consume the existing Yrd cases at an immutable test-only revision.
      # Their fixture writes and ref assertions always use native Git.
      - uses: actions/checkout@v4
        with:
          repository: beorn/yrd
          ref: 9c688d28edcb3fe142faa8639d065059c3ed5c43
          path: .yrd-conformance
      - run: bun install --frozen-lockfile
        working-directory: .yrd-conformance
      - name: Native Git control
        working-directory: .yrd-conformance
        env:
          YRD_TEST_GIT_TRACE: ${{ github.workspace }}/native-git-trace.jsonl
        run: >-
          bun --bun x vitest run
          packages/yrd-queue-core/tests/submit.test.ts
          packages/yrd-queue-core/tests/pause.test.ts
          --testTimeout 10000
          --reporter=default --reporter=json
          --outputFile=${{ github.workspace }}/native-git-results.json
      # Both legs use the same integration readiness budget, not a performance
      # claim. Keep per-call timings and flag cases above the former 5s budget.
      # Conformance failures stay visible; cases with no Git calls prove none.
      - name: Selected GitSuper executable
        working-directory: .yrd-conformance
        env:
          YRD_TEST_GIT_EXECUTABLE: ${{ github.workspace }}/bin/git-super
          YRD_TEST_GIT_TRACE: ${{ github.workspace }}/git-super-trace.jsonl
        run: >-
          bun --bun x vitest run
          packages/yrd-queue-core/tests/submit.test.ts
          packages/yrd-queue-core/tests/pause.test.ts
          --testTimeout 10000
          --reporter=default --reporter=json
          --outputFile=${{ github.workspace }}/git-super-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yrd-conformance-${{ github.sha }}
          path: |
            native-git-trace.jsonl
            native-git-results.json
            git-super-trace.jsonl
            git-super-results.json
          if-no-files-found: error
